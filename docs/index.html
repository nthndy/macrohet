function setupVideoHover(plotDiv) {
    // Create Tooltips
    const vTip = createElem('video-tooltip', '<video id="v-player" muted loop playsinline></video>');
    const tTip = createElem('video-text-tooltip', '');
    const player = document.getElementById('v-player');

    plotDiv.classList.add('hide-plotly-hover');

    plotDiv.on('plotly_hover', (data) => {
        if (!data.points[0].data.mode?.includes('markers')) return;
        
        let cData = data.points[0].customdata;
        if (Array.isArray(cData) && Array.isArray(cData[0])) cData = cData[0]; // Unwrap
        if (!cData || cData.length < 4) return;

        let [url, x, label, id] = [cData[0], data.points[0].x, cData[2], cData[3]];
        
        if (!url || url === 'nan') return;
        if (!url.startsWith('http') && !url.includes('assets')) url = `assets/${url}`;

        if (!player.src.endsWith(url)) player.src = url;
        player.play().catch(() => {});

        tTip.innerHTML = `<b>ID: ${id}</b><br><b>${x.toFixed(1)} hrs</b><br>${label}`;
        
        vTip.style.display = 'block';
        tTip.style.display = 'block';
        updateDualPos(vTip, tTip, data.event.clientX, data.event.clientY);
    });

    plotDiv.on('plotly_unhover', () => {
        vTip.style.display = 'none';
        tTip.style.display = 'none';
        player.pause();
    });

    document.addEventListener('mousemove', (e) => {
        if (vTip.style.display === 'block') updateDualPos(vTip, tTip, e.clientX, e.clientY);
    });
}

function updateDualPos(vEl, tEl, x, y) {
    const gap = 20;
    const winW = window.innerWidth;
    
    // Default: Video Right, Text Left
    let vLeft = x + gap;
    let tLeft = x - gap - tEl.offsetWidth;

    // Swap if Video doesn't fit Right
    if (vLeft + vEl.offsetWidth > winW) {
        vLeft = x - gap - vEl.offsetWidth;
        tLeft = x + gap;
    }

    // Apply (clamp edges if needed)
    vEl.style.left = Math.max(10, vLeft) + 'px';
    vEl.style.top = (y - 100) + 'px';
    tEl.style.left = Math.max(10, tLeft) + 'px';
    tEl.style.top = (y - 100) + 'px';
}

function createElem(id, html) {
    let el = document.getElementById(id);
    if (!el) {
        el = document.createElement('div');
        el.id = id; el.innerHTML = html;
        document.body.appendChild(el);
    }
    return el;
}

function setupGlobalEscape() {
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            document.querySelectorAll('#video-tooltip, #video-text-tooltip').forEach(el => el.style.display = 'none');
            const v = document.getElementById('v-player');
            if (v) v.pause();
        }
    });
}
